name: build
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64-v8a
        run: |
          sudo apt-get install -y zip cmake
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          echo "using NDK: $NDK"
          test -d "$NDK" || { echo "NDK folder not found"; exit 1; }
          ANDROID_NDK_HOME="$NDK" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: water_mod
          path: dist/
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests run
