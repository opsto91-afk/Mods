# APK build — ai-mentor (Capacitor Android)
# Local sandbox me Google/Gradle servers blocked hain, isliye runner pe build hota hai.
# Trigger: ai-mentor ya workflow badalne pe push, ya manual (workflow_dispatch).
name: Build APK

on:
  push:
    branches: [arena/3a49430d-mods, main]
    paths:
      - 'ai-mentor/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

# apk-output branch pe APK commit karne ke liye (sandbox se azure blob blocked hai)
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ai-mentor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-mentor/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Check (typecheck + tests + web build)
        run: npm run check

      - name: Setup Java 21 (AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" 2>&1 | tail -8

      - name: Build debug APK
        working-directory: ai-mentor/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'build.log')
          if os.path.exists(path):
              lines = open(path, errors='replace').readlines()
              selected = [line for line in lines if any(x in line.lower() for x in ['error:', 'what went wrong', 'failed:', 'fatal error', 'cmake error', 'could not', 'failure:', 'symbol'])]
              text = ''.join(selected[-35:]) or ''.join(lines[-80:])
              print('::error::' + text[-7500:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY

      - name: APK info
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          echo "### 📦 APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install: phone pe download karo → Settings → Install unknown apps" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-mentor-debug-apk
          path: ai-mentor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Azure blob (artifact download) kuch networks pe blocked hota hai —
      # isliye APK ek dedicated branch pe bhi commit hota hai, git se fetch ho sakta hai.
      - name: Publish APK to apk-output branch
        run: |
          set -euo pipefail
          # NOTE: defaults.run.working-directory = ai-mentor — pehle repo root pe jao
          cd "$GITHUB_WORKSPACE"
          APK="ai-mentor/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-output
          git rm -rfq --cached . || true
          mkdir -p apk
          cp /tmp/app-debug.apk apk/app-debug.apk
          echo "Commit: ${GITHUB_SHA}" > apk/BUILD_INFO.txt
          echo "Run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> apk/BUILD_INFO.txt
          echo "Size:   $(du -h apk/app-debug.apk | cut -f1)" >> apk/BUILD_INFO.txt
          git add -f apk/app-debug.apk apk/BUILD_INFO.txt
          git commit -m "APK build ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push --force origin HEAD:apk-output

      # Release asset = ek-click download link (raw link se mobile pe better UX)
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APK="ai-mentor/android/app/build/outputs/apk/debug/app-debug.apk"
          NICE="AIMentor-v0.1-debug.apk"
          cp "$APK" "/tmp/$NICE"
          TAG="v0.1"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "AI Mentor ${TAG} (debug APK)" \
              --notes "Personal AI tutor — cloud + local AI, branch chats, diagram stage. Debug-signed."
          fi
          gh release upload "$TAG" "/tmp/$NICE" --repo "$GITHUB_REPOSITORY" --clobber
