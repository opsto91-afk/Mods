# APK build — ai-mentor (Capacitor Android)
# Local sandbox me Google/Gradle servers blocked hain, isliye runner pe build hota hai.
# Trigger: ai-mentor ya workflow badalne pe push, ya manual (workflow_dispatch).
name: Build APK

on:
  push:
    branches: [arena/3a49430d-mods, main]
    paths:
      - 'ai-mentor/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ai-mentor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-mentor/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Check (typecheck + tests + web build)
        run: npm run check

      - name: Setup Java 21 (AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: ai-mentor/android

      - name: APK info
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          echo "### 📦 APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install: phone pe download karo → Settings → Install unknown apps" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-mentor-debug-apk
          path: ai-mentor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
